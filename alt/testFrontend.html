<!DOCTYPE html>
<html lang="de">
<head>
    <!-- Metadaten des Dokuments -->
    <meta charset="UTF-8"> <!-- Legt die Zeichenkodierung auf UTF-8 fest -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Sorgt dafür, dass die Seite auf Mobilgeräten responsiv dargestellt wird -->
    <title>Daten von MariaDB</title> <!-- Der Titel der Webseite, der in der Registerkarte des Browsers angezeigt wird -->
</head>
<body>
    <!-- Hauptinhalt der Seite -->
    <h1>MariaDB-Daten abrufen</h1> <!-- Überschrift der Seite -->
    
    <!-- Button, um die Daten vom Server abzurufen -->
    <button id="fetchDataBtn">Daten abrufen</button> <!-- Ein Button, der angeklickt wird, um eine Anfrage an den Server zu senden -->
    
    <!-- Div-Element, in dem die abgerufenen Daten angezeigt werden -->
    <div id="dataContainer"></div> <!-- Hier werden die Daten, die vom Server kommen, dynamisch eingefügt -->

    <script>
        // Fügt einen Klick-EventListener dem Button hinzu
        document.getElementById('fetchDataBtn').addEventListener('click', function() {
            // Sendet eine HTTP-GET-Anfrage an den Node.js-Server, um Daten von '/get-data' abzurufen
            fetch('http://localhost:3000/get-data')
                .then(response => response.json()) // Konvertiert die Antwort vom Server in ein JSON-Objekt
                .then(data => {
                    // Wenn die Daten erfolgreich abgerufen wurden, erstelle eine Liste zur Anzeige der Daten
                    let output = '<ul>';
                    // Durchlaufe das Array 'data' und erstelle ein Listenelement für jede Zeile (row)
                    data.forEach(row => {
                        output += `<li>ID: ${row.id}, Name: ${row.name}</li>`; // Füge die ID und den Namen in die Liste ein
                    });
                    output += '</ul>'; // Schließe die Liste
                    // Füge die generierte Liste in das 'dataContainer'-Div ein, um sie auf der Seite anzuzeigen
                    document.getElementById('dataContainer').innerHTML = output;
                })
                .catch(error => {
                    // Falls ein Fehler auftritt, wird er in der Konsole angezeigt
                    console.error('Fehler:', error);
                });
        });
    </script>
</body>
</html>
