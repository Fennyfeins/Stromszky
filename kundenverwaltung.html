<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kundenverwaltung</title>
    <link rel="stylesheet" href="styleKundenverwaltung.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="language">
                <button class="dropbtn">Deutsch</button>
                <div class="dropdown-content">
                    <a href="#">Deutsch</a>
                    <a href="#">Englisch</a>
                </div>
            </div>
            <h1>Kundenverwaltung</h1>
        </header>
        <main>
            <div class="search-section">
                <input type="text" id="search" placeholder="Name/-vorname">
                <button class="btn-create">Kunden anlegen</button>
            </div>

            <div class="info-section">
                <ul>
                    <li>Name</li>
                    <li>Vorname</li>
                    <li>Geburtsdatum</li>
                    <li>Telefonnummer</li>
                    <li>Anschrift</li>
                    <li>IBAN und ggf. BIC (nur Ausland)</li>
                </ul>
            </div>

            <div class="buttons">
                <button class="btn-cancel">Abbrechen</button>
                <button class="btn-edit">Ändern</button>
                <button class="btn-save">Speichern</button>
            </div>
        </main>
    </div>
</body>
</html>
