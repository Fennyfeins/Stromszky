<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kundenverwaltung</title>
    <link rel="stylesheet" href="styleKundenverwaltung.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="language">
                <button class="dropbtn">Deutsch</button>
                <div class="dropdown-content">
                    <a href="#">Deutsch</a>
                    <a href="#">Englisch</a>
                </div>
            </div>
            <h1>Kundenverwaltung</h1>
        </header>
        <main>
            <div class="search-section">
                <input type="text" id="search" placeholder="Name/-vorname">
                <button class="btn-create">Kunden anlegen</button>
            </div>

            <div class="info-section">
                <ul>
                    <li>Name</li>
                    <li>Vorname</li>
                    <li>Geburtsdatum</li>
                    <li>Telefonnummer</li>
                    <li>Anschrift</li>
                    <li>IBAN und ggf. BIC (nur Ausland)</li>
                </ul>
            </div>

            <div class="buttons">
                <button class="btn-cancel">Abbrechen</button>
                <button class="btn-edit">Ändern</button>
                <button class="btn-save">Speichern</button>
              <!--<button id="btn-search">Suchen</button>-->
            </div>
        </main>
    </div>

    <script>// Fügt einen Klick-EventListener dem Button hinzu
        <button id="btn-search">Suchen</button>
        document.getElementById('btn-search').addEventListener('click', function () {
        // Sendet eine HTTP-GET-Anfrage an den Node.js-Server, um Daten von '/get-data' abzurufen
        fetch('http://localhost:3000/get-data')
            .then(response => response.json()) // Konvertiert die Antwort vom Server in ein JSON-Objekt
            .then(data => {
                // Wenn die Daten erfolgreich abgerufen wurden, erstelle eine Liste zur Anzeige der Daten
                let output = '<ul>';
                // Durchlaufe das Array 'data' und erstelle ein Listenelement für jede Zeile (row)
                data.forEach(row => {
                    output += `<li>ID: ${row.id}, Name: ${row.name}</li>`; // Füge die ID und den Namen in die Liste ein
                });
                output += '</ul>'; // Schließe die Liste
                // Füge die generierte Liste in das 'dataContainer'-Div ein, um sie auf der Seite anzuzeigen
                document.getElementById('dataContainer').innerHTML = output;
            })
            .catch(error => {
                // Falls ein Fehler auftritt, wird er in der Konsole angezeigt
                console.error('Fehler:', error);
            });
    });</script>
</body>
</html>
